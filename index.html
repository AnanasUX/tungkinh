<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Chùa An Nhiên — Không Gian Tu Học & Đạo Tràng Trực Tuyến</title>

  <!-- TYPOGRAPHY FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- MODERN UI DESIGN STYLESHEET (FROM NEW FIGMA CHÙA AN NHIÊN UI) -->
  <link rel="stylesheet" href="css/modern-ui.css?v=20261105_1720">

  <!-- REALTIME & LIVEKIT SFU WEBRTC LIBRARIES -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    /* Full viewport reset for React Game Shell */
    html, body, #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #17130e;
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Subtle pulse animation for Video Call button in dock */
    .action-dock button[title*="Video"] {
      border: 1px solid rgba(242, 199, 102, 0.4);
      background: rgba(242, 199, 102, 0.12);
    }
  </style>
</head>
<body>
  <!-- REACT 19 MOUNT CONTAINER (100% NEW CHÙA AN NHIÊN UI) -->
  <div id="root"></div>

  <!-- SANCTUARY CORE CLIENT PROFILE INITIALIZER -->
  <script>
    window.SANCTUARY_CLIENT_ID = 'user_' + Math.random().toString(36).substring(2, 9);
    window.currentUserProfile = {
      registered: true,
      fullName: 'Tuệ Phúc',
      dharmaName: 'Minh Tâm',
      clientIp: '113.161.45.12',
      meritScore: 150,
      assignedSeatNo: 4,
      avatarType: 'monk',
      wish: 'Cầu quốc thái dân an, gia đạo ấm êm và tâm hồn thanh tịnh'
    };
  </script>

  <!-- REAL-TIME & WEBRTC CALLING ENGINE -->
  <script src="js/supabase-sanctuary.js?v=20261105_1720"></script>
  <script src="js/room-chat.js?v=20261105_1720"></script>

  <!-- STANDALONE BUNDLE (THREE.JS 3D TEMPLE SCENE, DOCK, PANELS, AUDIO) -->
  <script type="module" src="dist/app.bundle.js?v=20261105_1720"></script>

  <script>
    window.addEventListener('load', async () => {
      // Connect to Supabase Realtime Presence
      if (window.SupabaseSanctuary) {
        try {
          await window.SupabaseSanctuary.init();
          console.log('[Sanctuary] Supabase Realtime connected.');
        } catch (e) {
          console.warn('[Sanctuary] Supabase init warning:', e);
        }
      }
    });
  </script>
</body>
</html>
